name: Update myTCAS Views 2x Daily

on:
  schedule:
    # รันเวลา 23:00 UTC (06:00 ไทย) และ 11:00 UTC (18:00 ไทย)
    - cron: '0 23,11 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดสั่งรันเองได้ตลอดเวลา

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ให้สิทธิ์บอทบันทึกไฟล์กลับเข้ามาใน repo

    steps:
      - name: เช็กเอาต์โค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: รันสคริปต์ดึงยอดวิว
        run: python updater.py

      - name: บันทึกไฟล์ data.json ขึ้น GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto Update: Sync myTCAS real views [skip ci]" || exit 0
          git push
