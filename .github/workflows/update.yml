name: Update myTCAS Views 2x Daily

on:
  schedule:
    - cron: '0 23,11 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chrome
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python updater.py

      - name: Commit & Push data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto Update: Sync real views via Chrome [skip ci]" || exit 0
          git push
